<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilote CRM - Analyse de ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #007bff;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-size: 1.1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffdddd;
            border-radius: 5px;
        }
        .info {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>🤖 Copilote CRM</h1>
    <h2 style="text-align: center; color: #555;">Analyse intelligente de ticket</h2>
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <label for="ticket_id">ID du ticket (optionnel)</label>
        <input type="number" id="ticket_id" name="ticket_id" placeholder="Ex: 101" value="0">
        
        <label for="client_id">ID du client</label>
        <input type="number" id="client_id" name="client_id" placeholder="Ex: 1" required value="1">
        
        <label for="description">Description du problème</label>
        <textarea id="description" name="description" rows="5" required placeholder="Décrivez le problème rencontré par le client..."></textarea>
        
        <label for="priorite">Priorité déclarée</label>
        <select id="priorite" name="priorite">
            <option value="Haute">Haute</option>
            <option value="Moyenne" selected>Moyenne</option>
            <option value="Basse">Basse</option>
        </select>
        
        <button type="submit">Analyser le ticket</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #888; font-size: 0.85em;">
        Le système analyse le ticket en 5 étapes : Classification → Routage → Résumé → Réponse → Action
    </p>
</body>
</html>
